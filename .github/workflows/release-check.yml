name: Accountable Release Check

on:
  push:
    branches:
      - release/accountable-1.0
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Validate Capacitor config
        run: npx cap config

      - name: Ensure Android native project exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists; skipping cap add android"
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify Android project
        run: test -f android/app/build.gradle && test -f android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: accountable-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
