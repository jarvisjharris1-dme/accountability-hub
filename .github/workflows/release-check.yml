name: Accountable Release Check

on:
  push:
    branches:
      - release/accountable-1.0
  pull_request:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Validate Capacitor config
        run: npx cap config

      - name: Ensure Android native project exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists; skipping cap add android"
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Restore Android release keystore when configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/accountable-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/accountable-release.jks" >> "$GITHUB_ENV"

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Android release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: accountable-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Android release AAB
        uses: actions/upload-artifact@v4
        with:
          name: accountable-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Ensure iOS native project exists
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          else
            echo "iOS project already exists; skipping cap add ios"
          fi

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate iOS project build without signing
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
