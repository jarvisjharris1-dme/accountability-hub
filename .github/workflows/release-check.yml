name: Accountable Release Check

on:
  push:
    branches:
      - release/accountable-1.0
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Validate Capacitor config
        run: npx cap config

      - name: Generate Android native project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify Android project
        run: test -f android/app/build.gradle && test -f android/app/src/main/AndroidManifest.xml

      - name: Upload Android native project
        uses: actions/upload-artifact@v4
        with:
          name: accountable-android-native
          path: android
          retention-days: 14
